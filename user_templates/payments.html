<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    color: #333;
    min-height: 100vh;
  }

  .container { display: flex; height: 100vh; }

  .sidebar {
    width: 240px;
    background: #1f2937;
    color: #fff;
    padding: 25px 20px;
    display: flex;
    flex-direction: column;
  }
  .sidebar h3 { margin-bottom: 20px; font-size: 22px; }
  .sidebar a {
    display: block;
    margin: 12px 0;
    text-decoration: none;
    color: #cbd5e1;
    font-weight: 500;
    padding: 8px 10px;
    border-radius: 6px;
    transition: 0.3s;
  }
  .sidebar a:hover { background: #374151; color: #fff; }
  .sidebar a.active { background: #2563eb; color: #fff; font-weight: bold; }

  .main { flex: 1; padding: 30px 40px; overflow-y: auto; }
  .main h2 { font-size: 28px; margin-bottom: 5px; }
  .main p { color: #4b5563; margin-bottom: 25px; }

  #payment-list { max-height: 500px; overflow-y: auto; padding-right: 5px; }
  #payment-list::-webkit-scrollbar { width: 6px; }
  #payment-list::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }

  .payment-card {
    background: #fff;
    padding: 20px 25px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .payment-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
  .payment-info { display: flex; align-items: center; gap: 20px; }
  .payment-info img { width: 55px; }
  .payment-details { display: flex; flex-direction: column; }
  .payment-details strong { font-size: 18px; }
  .payment-details span { font-size: 14px; color: #6b7280; }
  .payment-details small { font-size: 12px; color: #9ca3af; }

  .default-badge {
    background: #10b981;
    color: #fff;
    padding: 3px 8px;
    font-size: 12px;
    border-radius: 12px;
    margin-top: 4px;
    display: inline-block;
  }

  .delete-btn {
    background: #ef4444;
    border: none;
    color: #fff;
    font-size: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
  }
  .delete-btn:hover { background: #b91c1c; }

  .add-method { margin-top: 25px; text-align: center; }
  .add-method button {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    transition: 0.3s;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }
  .add-method button:hover {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h3>Admin Panel</h3>
    <a href="dashboard.html">Dashboard</a>
    <a href="subscription_plans.html">Subscription Plans</a>
    <a href="billing.html">Billing History</a>
    <a href="payments.html" class="active">Payment Methods</a>
    <a href="account_settings.html">Account Settings</a>
  </div>
  <div class="main">
    <h2>Payment Methods</h2>
    <p>Click on a payment method to open it</p>
    <div id="payment-list"></div>
    <div class="add-method">
      <button onclick="addPaymentMethod()">+ Add Payment Method</button>
    </div>
  </div>
</div>

<script>
  const payments = [
    { type: 'Paytm', last4: '', expires: '', default: true, url: 'https://paytm.com/' },
    { type: 'PhonePe', last4: '', expires: '', default: false, url: 'https://www.phonepe.com/' },
    { type: 'Google Pay', last4: '', expires: '', default: false, url: 'https://pay.google.com/' },
    { type: 'Visa', last4: '4242', expires: '12/2026', default: false, url: 'https://visa.com/' },
    { type: 'Mastercard', last4: '1234', expires: '08/2025', default: false, url: 'https://www.mastercard.com/' }
  ];

  function getCardLogo(type) {
    switch(type.toLowerCase()) {
      case 'visa': return 'https://img.icons8.com/color/48/000000/visa.png';
      case 'mastercard': return 'https://img.icons8.com/color/48/000000/mastercard.png';
      case 'paytm': return 'https://img.icons8.com/color/48/000000/paytm.png';
      case 'phonepe': return 'https://img.icons8.com/color/48/000000/phonepe.png';
      case 'google pay': return 'https://img.icons8.com/color/48/000000/google-pay-india.png';
      default: return 'https://img.icons8.com/ios-filled/50/000000/bank-card-back-side.png';
    }
  }

  function renderPayments() {
    const list = document.getElementById('payment-list');
    list.innerHTML = '';
    payments.forEach((pay, index) => {
      const div = document.createElement('div');
      div.className = 'payment-card';
      
      // Click anywhere except delete button to open URL
      div.addEventListener('click', (e) => {
        if(!e.target.classList.contains('delete-btn')) {
          if(pay.url) window.open(pay.url, '_blank');
          else alert('No URL defined for this payment method.');
        }
      });

      div.innerHTML = `
        <div class="payment-info">
          <img src="${getCardLogo(pay.type)}" alt="card">
          <div class="payment-details">
            <strong>${pay.type}</strong> ${pay.default ? '<span class="default-badge">Default</span>' : ''}
            ${pay.last4 ? <span>•••• •••• •••• ${pay.last4}</span> : ''}
            ${pay.expires ? <small>Expires ${pay.expires}</small> : ''}
          </div>
        </div>
        <button class="delete-btn" onclick="deletePayment(${index})">&#128465;</button>
      `;
      list.appendChild(div);
    });
  }

  function addPaymentMethod() {
    const type = prompt("Enter payment method (Visa, Mastercard, Paytm, PhonePe, Google Pay, etc.):");
    const last4 = prompt("Enter last 4 digits (or leave blank for wallets):");
    const expires = prompt("Enter expiry (MM/YYYY) if applicable:");
    const url = prompt("Enter URL to open for this payment method:");
    const isDefault = confirm("Set as default?");
    if(isDefault) payments.forEach(p => p.default = false);
    payments.push({ type, last4, expires, default: isDefault, url });
    renderPayments();
  }

  function deletePayment(index) {
    payments.splice(index, 1);
    renderPayments();
  }

  renderPayments();
</script>
</body>
</html>
