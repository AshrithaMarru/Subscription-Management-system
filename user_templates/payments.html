<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    color: #333;
    min-height: 100vh;
  }

  .container { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 240px;
    background: #1f2937;
    color: #fff;
    padding: 25px 20px;
    display: flex;
    flex-direction: column;
  }
  .sidebar h3 { margin-bottom: 20px; font-size: 22px; }
  .sidebar a {
    display: block;
    margin: 12px 0;
    text-decoration: none;
    color: #cbd5e1;
    font-weight: 500;
    padding: 8px 10px;
    border-radius: 6px;
    transition: 0.3s;
  }
  .sidebar a:hover { background: #374151; color: #fff; }
  .sidebar a.active { background: #2563eb; color: #fff; font-weight: bold; }

  /* Main */
  .main { flex: 1; padding: 30px 40px; overflow-y: auto; }
  .main h2 { font-size: 28px; margin-bottom: 5px; }
  .main p { color: #4b5563; margin-bottom: 25px; }

  /* Payment Cards */
  #payment-list { max-height: 500px; overflow-y: auto; padding-right: 5px; }
  #payment-list::-webkit-scrollbar { width: 6px; }
  #payment-list::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }

  .payment-card {
    background: #fff;
    padding: 20px 25px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .payment-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
  .payment-info { display: flex; align-items: center; gap: 20px; }
  .payment-info img { width: 55px; }
  .payment-details { display: flex; flex-direction: column; }
  .payment-details strong { font-size: 18px; }
  .payment-details span { font-size: 14px; color: #6b7280; }

  /* Popup */
  .popup {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .popup-content {
    background: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }
  .popup-content h3 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #10b981;
  }
  .popup-content button {
    margin-top: 15px;
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .popup-content button:hover { background: #1e40af; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h3>Admin Panel</h3>
    <a href="dashboard.html">Dashboard</a>
    <a href="subscription_plans.html">Subscription Plans</a>
    <a href="billing.html">Billing History</a>
    <a href="payments.html" class="active">Payments</a>
    <a href="account_settings.html">Account Settings</a>
  </div>
  <div class="main">
    <h2>Payments</h2>
    <p>Select a payment method to continue</p>
    <div id="payment-list"></div>
  </div>
</div>

<!-- Popup -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>✅ Payment Completed Successfully!</h3>
    <p>Your transaction has been confirmed.</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
  const payments = [
    { type: 'Paytm' },
    { type: 'PhonePe' },
    { type: 'Google Pay' },
    { type: 'Visa' },
    { type: 'Mastercard' }
  ];

  function getCardLogo(type) {
    switch(type.toLowerCase()) {
      case 'visa': return 'https://img.icons8.com/color/48/000000/visa.png';
      case 'mastercard': return 'https://img.icons8.com/color/48/000000/mastercard.png';
      case 'paytm': return 'https://img.icons8.com/color/48/000000/paytm.png';
      case 'phonepe': return 'https://img.icons8.com/color/48/000000/phonepe.png';
      case 'google pay': return 'https://img.icons8.com/color/48/000000/google-pay-india.png';
      default: return 'https://img.icons8.com/ios-filled/50/000000/bank-card-back-side.png';
    }
  }

  function renderPayments() {
    const list = document.getElementById('payment-list');
    list.innerHTML = '';
    payments.forEach((pay) => {
      const div = document.createElement('div');
      div.className = 'payment-card';
      div.innerHTML = `
        <div class="payment-info">
          <img src="${getCardLogo(pay.type)}" alt="card">
          <div class="payment-details">
            <strong>${pay.type}</strong>
            <span>Click to proceed</span>
          </div>
        </div>
      `;
      div.addEventListener('click', () => startPayment(pay.type));
      list.appendChild(div);
    });
  }

  function startPayment(type) {
    // Simulate delay for payment completion
    setTimeout(() => {
      document.getElementById('popup').style.display = 'flex';
    }, 1500);
  }

  function closePopup() {
    document.getElementById('popup').style.display = 'none';
  }

  renderPayments();
</script>
</body>
</html>
